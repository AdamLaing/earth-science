<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U3 Practical Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --teal: #1F8A9E; --font: Lexend, "Segoe UI", Helvetica, Arial, sans-serif; }
  html, body { margin: 0; background: #fff; font-family: var(--font); color: #222; }
  header { padding: 10px 20px 0; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 3px solid var(--teal); }
  nav button { font-family: var(--font); font-size: 16px; padding: 8px 12px; border: 3px solid var(--teal); border-bottom: none;
               border-radius: 10px 10px 0 0; background: #fff; color: var(--teal); cursor: pointer; margin-bottom: -3px; }
  nav button small { display: block; font-size: 12px; color: #555; }
  nav button.on { background: var(--teal); color: #fff; }
  nav button.on small { color: #dff; }
  main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr); gap: 16px; padding: 12px 20px 20px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  #pic svg { width: 100%; height: auto; display: block; max-height: calc(100vh - 150px); }
  #pic { position: relative; }
  #skylab { position: absolute; inset: 0; z-index: 5; background: #fff; border: 3px solid #E0A800; border-radius: 14px; padding: 10px 16px;
            overflow: auto; font-size: 17px; }
  #skylab[hidden] { display: none; }
  #skylab .head { display: flex; align-items: center; gap: 12px; }
  #skylab h2 { font-size: 21px; margin: 0; flex: 1; }
  #skylab .body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(220px, 1fr); gap: 16px; align-items: start; }
  #skylab #labSky svg { width: 100%; height: auto; max-height: none; border: 1px solid #ddd; border-radius: 10px; cursor: grab; touch-action: none; }
  #skylab label { display: block; font-weight: 700; margin: 8px 0 0; }
  #skylab label span { font-weight: 400; color: #555; }
  #skylab input[type=range] { width: 100%; accent-color: #E0A800; }
  /* time slider: gray for night, gold for daylight (set from the latitude and time of year) */
  #labTime { -webkit-appearance: none; appearance: none; background: transparent; height: 26px; }
  #labTime::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; background: var(--track, #E0A800); border: 1px solid #bbb; }
  #labTime::-moz-range-track { height: 12px; border-radius: 6px; background: var(--track, #E0A800); border: 1px solid #bbb; }
  #labTime::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -7px; border-radius: 50%; background: #fff; border: 4px solid #E0A800; }
  #labTime::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 4px solid #E0A800; }
  #labTimeKey { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-top: -2px; }
  #skylab button { font-family: var(--font); font-size: 15px; padding: 5px 12px; border-radius: 8px; border: 2px solid #444; background: #fff; cursor: pointer; }
  #labRead { background: #FFF6D6; border-left: 6px solid #E0A800; border-radius: 6px; padding: 8px 12px; margin: 10px 0; }
  #labSide svg.sideview { max-width: 300px; }
  svg.sideview { width: 100%; max-width: 320px; height: auto; display: block; max-height: none; }
  #sky .nycbtn { font-family: var(--font); font-size: 15px; padding: 4px 12px; border-radius: 8px; border: 2px solid #E0A800; background: #fff; color: #7a5c00; cursor: pointer; font-weight: 600; margin: 4px 0 12px; }
  svg text { font-family: var(--font); }
  #picbar { display: flex; align-items: center; gap: 12px; font-size: 15px; color: #555; }
  #draghint[hidden], #reset[hidden] { display: none; }
  #reset { font-family: var(--font); font-size: 15px; padding: 4px 12px; border: 2px solid #444; border-radius: 8px; background: #fff; cursor: pointer; }
  #picinfo { color: #999; font-size: 12px; margin-left: auto; }
  #compassBtn { font-family: var(--font); font-size: 15px; padding: 4px 12px; border: 2px solid #d7263d; border-radius: 8px; background: #fff; color: #d7263d; cursor: pointer; font-weight: 600; }
  #compassBtn.on { background: #d7263d; color: #fff; }
  #compassBtn[hidden], #landBtn[hidden] { display: none; }
  #landBtn { font-family: var(--font); font-size: 15px; padding: 4px 12px; border: 2px solid #5f8a3a; border-radius: 8px; background: #fff; color: #4d7a2a; cursor: pointer; font-weight: 600; }
  #landBtn.on { background: #5f8a3a; color: #fff; }
  #svg.turn { cursor: grab; touch-action: none; }
  #svg.turn:active { cursor: grabbing; }
  #panel { font-size: 20px; line-height: 1.45; }
  #intro { background: #EAF5F7; border-radius: 12px; padding: 10px 14px; font-size: 17px; margin: 0 0 12px; }
  #qcount { color: var(--teal); font-weight: 600; font-size: 16px; }
  #qtext { font-size: 22px; margin: 4px 0 12px; }
  #choices { display: flex; flex-wrap: wrap; gap: 10px; }
  #choices.scale { display: grid; grid-template-columns: repeat(3, 1fr); }
  #choices.grid8 { display: grid; grid-template-columns: repeat(3, 104px); grid-template-rows: repeat(3, 58px); gap: 8px; }
  #choices.grid8 button { min-width: 0; padding: 2px; }
  #choices.grid8 button.mid { font-size: 14px; line-height: 1.15; }
  #choices.times { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #choices.times button { font-size: 16px; min-width: 0; padding: 6px 4px; line-height: 1.2; }
  #choices.times button small { font-size: 13px; }
  #choices button.sel { border-color: var(--teal); background: #DDF1F4; box-shadow: inset 0 0 0 2px var(--teal); }
  #check { font-family: var(--font); font-size: 18px; font-weight: 700; padding: 8px 16px; margin-top: 10px; border-radius: 12px;
           border: 3px solid var(--teal); background: #fff; color: var(--teal); cursor: pointer; }
  #check:disabled { opacity: 0.4; cursor: default; }
  #check[hidden] { display: none; }
  body.touring #check { display: none; }
  /* while an answer's sky diagram is showing, clear away what isn't needed (Adam, 2026-11-25) */
  body.answering #introRow, body.answering #qcount, body.answering #score, body.answering #tourBtn { display: none; }
  #choices button { font-family: var(--font); font-size: 22px; font-weight: 700; min-width: 64px; min-height: 52px; padding: 6px 14px;
                    border: 3px solid #444; border-radius: 12px; background: #fff; color: #222; cursor: pointer; }
  #choices button small { display: block; font-size: 14px; font-weight: 400; color: #555; }
  #choices button:hover:not(:disabled) { background: #f2f2f2; }
  #choices button.wrong { border-color: #c0392b; background: #fdecea; color: #c0392b; text-decoration: line-through; }
  #choices button.right { border-color: #1e8449; background: #1e8449; color: #fff; }
  #choices button.right small { color: #e8f8ee; }
  #choices button:disabled { cursor: default; }
  #feedback { min-height: 30px; margin: 14px 0 8px; font-size: 19px; }
  #feedback.try { color: #a04000; }
  #feedback.done { background: #f4f9f5; border-left: 6px solid #1e8449; padding: 8px 12px; border-radius: 6px; }
  #feedback.done.missed { background: #fdf6ec; border-left-color: #e67e22; }
  #sky svg { width: 100%; max-width: 380px; display: block; border-radius: 10px; border: 1px solid #ddd; cursor: grab; touch-action: none; }
  #sky .skyhint { font-size: 14px; color: #555; margin: 4px 0 12px; }
  #next { font-family: var(--font); font-size: 20px; font-weight: 700; padding: 10px 18px; border-radius: 12px;
          border: 3px solid var(--teal); background: var(--teal); color: #fff; cursor: pointer; }
  #next[hidden] { display: none; }
  #score { margin-top: 18px; color: #555; font-size: 16px; }
  body.clean header, body.clean #panel, body.clean #picbar { display: none; }
  body.clean main { display: block; padding: 0; }
  body.clean #pic svg { max-height: none; }
  #tourBtn { font-family: var(--font); font-size: 16px; font-weight: 600; padding: 6px 14px; margin: 0 0 10px; border: 2px solid var(--teal);
             border-radius: 10px; background: #fff; color: var(--teal); cursor: pointer; }
  #tourBtn[hidden], #tour[hidden] { display: none; }
  #tour { border: 3px solid var(--teal); border-radius: 14px; padding: 12px 16px; background: #fff; font-size: 18px; line-height: 1.45; }
  #tourCount { color: var(--teal); font-weight: 600; font-size: 15px; }
  #tourTitle { font-size: 22px; margin: 2px 0 6px; }
  #tourText { margin: 0 0 10px; }
  #tourAsk { background: #FFF6D6; border-left: 6px solid #E0A800; border-radius: 6px; padding: 8px 12px; margin: 0 0 6px; font-weight: 600; }
  #tourAsk:empty { display: none; }
  #tourCtl { display: flex; align-items: center; gap: 12px; margin: 0 0 8px; }
  #tourCtl[hidden] { display: none; }
  #tourPlay { font-family: var(--font); font-size: 17px; font-weight: 700; padding: 6px 14px; border-radius: 10px; border: 3px solid #7B3FA0;
              background: #7B3FA0; color: #fff; cursor: pointer; min-width: 112px; }
  #tourTime { flex: 1; accent-color: #7B3FA0; }
  #tourMsg { min-height: 26px; font-size: 17px; margin: 0 0 8px; }
  #tourMsg.ok { color: #1e8449; font-weight: 700; }
  #tourMsg.no { color: #a04000; }
  #tourBtns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #tourBtns button { font-family: var(--font); font-size: 18px; font-weight: 700; padding: 8px 16px; border-radius: 10px; cursor: pointer;
                     border: 3px solid var(--teal); background: var(--teal); color: #fff; }
  #tourBtns button:disabled { opacity: 0.35; cursor: default; }
  #tourBtns #tourBack { background: #fff; color: var(--teal); }
  #tourBtns #tourSkip { margin-left: auto; background: none; border: none; color: #666; font-size: 15px; font-weight: 400; text-decoration: underline; padding: 4px; }
  body.touring #intro, body.touring #qcount, body.touring #qtext, body.touring #choices, body.touring #feedback,
  body.touring #sky, body.touring #next, body.touring #score, body.touring #tourBtn { display: none; }
  .sayrow { display: flex; gap: 10px; align-items: flex-start; }
  .sayrow > :first-child { flex: 1; min-width: 0; }
  .say { flex: none; width: 40px; height: 40px; margin-top: 2px; border: 2px solid var(--teal); border-radius: 50%; background: #fff;
         color: var(--teal); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
  .say svg { width: 22px; height: 22px; }
  .say.on { background: var(--teal); color: #fff; }
  .say[hidden], body.nospeech .say { display: none; }
  body.touring #sayIntro, body.touring #sayQ, body.touring #sayFb { display: none; }
  #key { font-size: 15px; padding: 0 20px 20px; }
  pre#st { font-size: 13px; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>U3 Practical Practice</h1>
  <nav id="tabs"></nav>
</header>
<main>
  <section id="pic"><svg id="svg" viewBox="0 0 900 580" role="img" aria-label="Practice picture"></svg>
    <div id="skylab" hidden>
      <div class="head"><h2>The Sun's height in New York City <span style="font-weight:400;font-size:16px;color:#555">(spring or fall equinox)</span></h2><button id="labClose">✕ Close</button></div>
      <div class="body">
        <div><div id="labSky"></div><div class="skyhint">Drag the sky to turn it. The small Suns mark 6, 8, 10, 12, 2, 4 and 6 o'clock.</div></div>
        <div>
          <label>Time of day: <span id="labTimeV"></span><input type="range" id="labTime" min="0" max="24" step="0.25"></label><div id="labTimeKey"><span>midnight</span><span>noon</span><span>midnight</span></div>
          <div id="labRead"></div>
          <div id="labSide"></div>
        </div>
      </div>
    </div>
    <div id="picbar"><span id="draghint">Drag the globe to turn it.</span> <button id="reset">Reset view</button> <button id="compassBtn">Compasses: on</button> <button id="landBtn">Continents: off</button><span id="picinfo"></span></div></section>
  <section id="panel">
    <button id="tourBtn" hidden>How to read this picture</button>
    <div id="tour" hidden>
      <div id="tourCount"></div>
      <div class="sayrow"><div id="tourTitle"></div><button class="say" id="sayTour"></button></div>
      <p id="tourText"></p>
      <p id="tourAsk"></p>
      <div id="tourCtl" hidden><button id="tourPlay">▶ Play</button><input type="range" id="tourTime" min="0" max="24" step="0.1" value="0" aria-label="Hours passed"></div>
      <div id="tourMsg"></div>
      <div id="tourBtns"><button id="tourBack">← Back</button><button id="tourNext">Next →</button><button id="tourSkip">Skip the tour</button></div>
    </div>
    <div class="sayrow" id="introRow"><p id="intro"></p><button class="say" id="sayIntro"></button></div>
    <div id="qcount"></div>
    <div class="sayrow"><div id="qtext"></div><button class="say" id="sayQ"></button></div>
    <div id="choices"></div>
    <button id="check" hidden disabled>Check my answer</button>
    <div class="sayrow"><div id="feedback"></div><button class="say" id="sayFb" hidden></button></div>
    <div id="sky"></div>
    <button id="next" hidden>Next question →</button>
    <div id="score"></div>
  </section>
</main>
<div id="key"></div>

<script>
(function () {
"use strict";
const rad = Math.PI / 180, W = 900, H = 580, SVGNS = "http://www.w3.org/2000/svg";

// ---------- random numbers (seeded, so a picture can be shown again) ----------
let rng = Math.random;
function mulberry32(a) { const f = mulberry32raw(a); for (let i = 0; i < 4; i++) f(); return f; }   // warm up: nearby seeds start too alike
function mulberry32raw(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = (a, b) => a + (b - a) * rng();
const pick = arr => arr[Math.floor(rng() * arr.length)];
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const mod = (x, m) => ((x % m) + m) % m;

// ---------- geometry ----------
// World frame: X points at the Sun, Z is north, Y is east at the point under the Sun.
// A city's "al" is its angle east of the noon line, so its clock time is 12 + al/15 hours.
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
function pos(lat, al) { const p = lat * rad, a = al * rad; return [Math.cos(p) * Math.cos(a), Math.cos(p) * Math.sin(a), Math.sin(p)]; }
function northV(lat, al) { const p = lat * rad, a = al * rad; return [-Math.sin(p) * Math.cos(a), -Math.sin(p) * Math.sin(a), Math.cos(p)]; }
function eastV(lat, al) { const a = al * rad; return [-Math.sin(a), Math.cos(a), 0]; }
function norm2(v) { const m = Math.hypot(v[0], v[1]); return m ? [v[0] / m, v[1] / m] : [0, 0]; }
function ang2(a, b) { a = norm2(a); b = norm2(b); return Math.acos(Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1]))) / rad; }
const sinAlt = c => Math.cos(c.lat * rad) * Math.cos(c.al * rad);      // equinox: how high the Sun is

// Camera: azimuth a (degrees from the Sun direction, toward east) and elevation e (90 = above the North Pole).
// a > 0 puts the Sun on the left of the picture, a < 0 on the right.
function makeCam(aDeg, eDeg) {
  const a = aDeg * rad, e = eDeg * rad;
  const C = [Math.cos(e) * Math.cos(a), Math.cos(e) * Math.sin(a), Math.sin(e)];
  const U = [-Math.sin(e) * Math.cos(a), -Math.sin(e) * Math.sin(a), Math.cos(e)];
  return { C, U, R: cross(U, C), a: aDeg, e: eDeg };
}
function mkScene(cam, hasSun, opts) {
  opts = opts || {};
  const R = opts.R || 215, cy = 290;
  const sunLeft = opts.sunLeft !== undefined ? opts.sunLeft : cam.R[0] < 0;   // which side the layout was built for
  const cx = opts.cx !== undefined ? opts.cx : (!hasSun ? 450 : (sunLeft ? 370 : 530));
  const P = v => ({ x: cx + R * dot(v, cam.R), y: cy - R * dot(v, cam.U), z: dot(v, cam.C) });
  const D = v => [dot(v, cam.R), -dot(v, cam.U)];
  const lon0 = rnd(0, 30);   // always drawn, so seeded pictures stay the same
  const sv = D([1, 0, 0]);
  return { cam, hasSun, R, cx, cy, P, D, s2: norm2(sv), sunSide: Math.hypot(sv[0], sv[1]), sunLeft, lon0: opts.lon0 !== undefined ? opts.lon0 : lon0 };
}
function rescene(sc, a, e) { return mkScene(makeCam(a, e), sc.hasSun, { R: sc.R, cx: sc.cx, lon0: sc.lon0, sunLeft: sc.sunLeft }); }
const ARM_PX = 38;
function cityG(sc, c, armPx) {
  const q = sc.P(pos(c.lat, c.al)), deg = (armPx || ARM_PX) / sc.R / rad;
  const g = Object.assign(q, { n2: sc.D(northV(c.lat, c.al)), e2: sc.D(eastV(c.lat, c.al)), arm: {}, dir: {}, lab: {} });
  for (const k of ["N", "S", "E", "W"]) {
    const pts = [];
    for (let i = 0; i <= 8; i++) {
      const f = deg * i / 8; let lat = c.lat, al = c.al;
      if (k === "N") lat += f; else if (k === "S") lat -= f;
      else al += (k === "E" ? 1 : -1) * f / Math.cos(c.lat * rad);
      pts.push(sc.P(pos(lat, al)));
    }
    const end = pts[8], prev = pts[7], t = norm2([end.x - prev.x, end.y - prev.y]);
    g.arm[k] = pts; g.dir[k] = norm2([end.x - q.x, end.y - q.y]);
    g.lab[k] = [end.x + t[0] * 13, end.y + t[1] * 13 + 6];
  }
  return g;
}
function compassOK(g) {
  if (g.z < 0.2) return false;
  for (const k in g.arm) { const e = g.arm[k][8]; if (e.z < 0.05 || Math.hypot(e.x - g.x, e.y - g.y) < 14) return false; }
  const nl = Math.hypot(g.n2[0], g.n2[1]), el = Math.hypot(g.e2[0], g.e2[1]);
  if (nl < 0.3 || el < 0.3) return false;
  const a = ang2(g.n2, g.e2); return a > 50 && a < 130;
}
function armsOf(g) { return g.dir; }   // the direction each drawn arm heads off in
function spotPath(c, upto) {   // internal check only (not drawn): points on the globe from city c toward where the Sun is overhead
  const p = pos(c.lat, c.al), X = [1, 0, 0], O = Math.acos(Math.max(-1, Math.min(1, p[0])));
  if (O < 1e-6) return [p];
  const n = 40, end = upto === undefined ? O : Math.min(O, upto), out = [];
  for (let i = 0; i <= n; i++) { const t = end * i / n, a = Math.sin(O - t) / Math.sin(O), b = Math.sin(t) / Math.sin(O);
    out.push([a * p[0] + b * X[0], a * p[1] + b * X[1], a * p[2] + b * X[2]]); }
  return out;
}
// The four arms plus the four gaps between them (NE = halfway between the N and E arms, and so on).
function arms8(g) { const d = g.dir, b = (p, q) => norm2([d[p][0] + d[q][0], d[p][1] + d[q][1]]);
  return { N: d.N, NE: b("N", "E"), E: d.E, SE: b("S", "E"), S: d.S, SW: b("S", "W"), W: d.W, NW: b("N", "W") }; }
// For a Sun-direction question, the surface line from the city toward the overhead-Sun point has to leave along the right arm (or gap) in the
// picture, by a clear margin. The line is drawn on the surface, like the arms, so this holds from any camera angle.
function sunArmOK(sc, g, want, c) {
  const pts = spotPath(c, ARM_PX / sc.R), q = sc.P(pts[pts.length - 1]), v = [q.x - g.x, q.y - g.y];
  const d = Object.entries(arms8(g)).map(([k, a]) => [k, ang2(a, v)]).sort((x, y) => x[1] - y[1]);
  return d[0][0] === want && d[1][1] - d[0][1] >= 10;
}
function spacedOK(gs, minD) {
  for (let i = 0; i < gs.length; i++) for (let j = i + 1; j < gs.length; j++)
    if (Math.hypot(gs[i].x - gs[j].x, gs[i].y - gs[j].y) < minD) return false;
  return true;
}
const inView = (x, y, m) => x > m && x < W - m && y > m && y < H - m;

// ---------- time of day ----------
const CATS = ["sunrise", "morning", "noon", "afternoon", "sunset", "night"];
const SCALE = [["Sunrise", "5–7 AM"], ["Morning", "7–11 AM"], ["Around noon", "11 AM–1 PM"], ["Afternoon", "1–5 PM"], ["Sunset", "5–7 PM"], ["Night", "7 PM–5 AM"]];
const HOURS = { sunrise: [6, 6], morning: [9, 10.33], noon: [11.75, 12.25], afternoon: [13.67, 15], sunset: [18, 18], night: [21, 27] };
const catAl = cat => (rnd(HOURS[cat][0], HOURS[cat][1]) - 12) * 15;
const CAT_PHRASE = { sunrise: "at sunrise", morning: "in the morning", noon: "around noon", afternoon: "in the afternoon", sunset: "at sunset", night: "in the night" };
const DIR8 = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
const DIR_WORD = { N: "north", NE: "northeast", E: "east", SE: "southeast", S: "south", SW: "southwest", W: "west", NW: "northwest" };

        : `City ${B.letter} is ${ns === "N" ? "closer to" : "farther from"} the North Pole than city ${A.letter}, so it's to the ${DIR_WORD[ns]}. It's also to the ${DIR_WORD[ew]}: going around the globe from ${A.letter} toward ${B.letter} follows ${A.letter}'s <b>${ew}</b> arm. Put together: ${B.letter} is <b>${DIR_WORD[dir]}</b> of ${A.letter}.`;
      qs.push({ text: `From ${bold(A.letter)}, which direction is ${bold(B.letter)}?`, choices: DIR8.map(d => [d]), grid: true, answer: DIR8.indexOf(dir),
        hint: `Put your finger on city ${A.letter} and follow the dotted line to ${B.letter}. Does it go along ${A.letter}'s N or S arm, its E or W arm, or some of both?`,
        reason: why + (naive !== dir ? ` On the screen ${B.letter} looks ${naiveWord} ${A.letter}, but on a globe north always points to the North Pole.` : "") });
    }
    if (polar && trap === 0) continue;   // from above, at least one pair must fool a "top of the screen is north" reader
    const pic = { cities: cs, paths: pairs };
    return { view: { sc, pic }, questions: qs };
  }
  return null;
}

function cityDir(A, B) {
  const north = B.lat - A.lat, east = (mod(B.al - A.al + 180, 360) - 180) * Math.cos((A.lat + B.lat) / 2 * rad);
  const ang = mod(Math.atan2(north, east) / rad, 360), k = Math.round(ang / 45) % 8;   // 0 = east, 90 = north
  return Math.abs(mod(ang - k * 45 + 180, 360) - 180) <= 16 ? ["E", "NE", "N", "NW", "W", "SW", "S", "SE"][k] : null;
}

// Cameras for the tabs with sunlight. side: +1 = Sun on the left, -1 = Sun on the right.
function sunCam(kind) {
  const side = rng() < 0.5 ? 1 : -1;
  if (kind === "above") return makeCam(90 * side, 90);
  if (kind === "high") return makeCam(side * rnd(65, 90), rnd(55, 80));
  return makeCam(side * rnd(70, 90), rnd(12, 35));
}

// ---------- tab 2: one city under the Sun ----------
function genOneCity() {
  const cat = pick(CATS);   // all six times of day equally often
  for (let t = 0; t < 400; t++) {
    const sc = mkScene(sunCam(pick(["above", "above", "high", "side"])), true);
    const c = { cat, lat: rnd(25, 58), al: catAl(cat), letter: pick(["A", "B", "C", "D", "E"]), compass: true, beam: cat !== "night" };
    const g = cityG(sc, c);
    if (!compassOK(g) || !inView(g.x, g.y, 70) || !clearOK(sc, [g], 66)) continue;
    if (cat !== "night" && (!sunDir8(c) || !sunArmOK(sc, g, sunDir8(c), c))) continue;
    const L = c.letter, qs = [sunQ(c, true)];
    qs.push({ text: `What time of day is it in ${bold(L)}?`, choices: SCALE, scale: true, answer: CATS.indexOf(cat), hint: TIME_HINT, reason: timeReason(cat, L), focus: c });
    const pic = { cities: [c], spin: true, arrows: true };
    return { view: { sc, pic }, questions: qs };
  }
  return null;
}

// ---------- tab 3: who's next? ----------
function genNext() {
  for (let t = 0; t < 600; t++) {
    const sc = mkScene(sunCam(pick(["above", "above", "high"])), true);
    const n = rng() < 0.5 ? 4 : 5, als = [];
    for (let k = 0; k < 60 && als.length < n; k++) {
      const a = rnd(-180, 180);
      if (Math.abs(Math.abs(a) - 90) < 14) continue;
      if (als.every(b => Math.abs(mod(a - b + 180, 360) - 180) >= 32)) als.push(a);
    }
    if (als.length < n) continue;
    const cs = als.map(al => ({ lat: rnd(28, 55), al, compass: false }));
    const night = cs.filter(c => Math.cos(c.al * rad) < 0), day = cs.filter(c => Math.cos(c.al * rad) > 0);
    if (night.length < 2 || day.length < 2) continue;
    const gs = cs.map(c => cityG(sc, c));
    if (!gs.every(g => g.z > 0.15 && inView(g.x, g.y, 50)) || !spacedOK(gs, 70) || !clearOK(sc, gs, 66) || !marksOK(sc, cs, gs)) continue;
    const best = (list, f) => { const s = list.map(c => [c, f(c)]).sort((x, y) => x[1] - y[1]); return s.length > 1 && s[1][1] - s[0][1] < 20 ? null : s[0][0]; };
    const srNext = best(night, c => mod(-90 - c.al, 360)), ssNext = best(day, c => mod(90 - c.al, 360));
    const ssJust = best(night, c => mod(c.al - 90, 360)), srJust = best(day, c => mod(c.al + 90, 360));
    if (!srNext || !ssNext || !ssJust || !srJust) continue;
    const letters = shuffle(["A", "B", "C", "D", "E"].slice(0, n)); cs.forEach((c, i) => c.letter = letters[i]);
    const hint = "Find the edge where cities go from night into day, and the edge where they go from day into night. Then follow the spin arrow.";
    const qs = [
      qLetter("Which city will see <b>sunrise</b> next?", letters, srNext.letter, hint,
        `Follow the spin arrow. Cities on the night side are moving toward the edge where night turns into day. City ${srNext.letter} is the closest one to that edge, so it sees sunrise next.`),
      qLetter("Which city will see <b>sunset</b> next?", letters, ssNext.letter, hint,
        `Follow the spin arrow. Cities on the day side are moving toward the edge where day turns into night. City ${ssNext.letter} is the closest one to that edge, so it sees sunset next.`)
    ];
    if (rng() < 0.5) qs.push(qLetter("Which city had <b>sunset</b> most recently?", letters, ssJust.letter, hint,
      `City ${ssJust.letter} is in the night, and it's the night city closest to the edge where day turns into night. It crossed that edge most recently.`));
    else qs.push(qLetter("Which city had <b>sunrise</b> most recently?", letters, srJust.letter, hint,
      `City ${srJust.letter} is in the day, and it's the day city closest to the edge where night turns into day. It crossed that edge most recently.`));
    const pic = { cities: cs, spin: true, arrows: true };
    return { view: { sc, pic }, questions: qs };
  }
  return null;
}

// ---------- tab 4: two flashlights on grid paper ----------
function genFlash() {
  let angles;   // never 15 with 30: both are "morning", so the time-of-day question can't tell them apart (Adam, 2026-11-24)
  do angles = shuffle([90, 50, 30, 15]).slice(0, 2); while (angles.includes(15) && angles.includes(30));   // 50 replaced 45 (Adam, 2026-11-25): 45 is a 10:35 AM Sun
  const [a1, a2] = angles, more = a1 > a2 ? 1 : 2, less = 3 - more;
  const kind = pick(["more direct", "less direct", "more energy", "less energy"]);
  const ans = kind.startsWith("more") ? more : less;
  const text = { "more direct": "Which flashlight's light is <b>more direct</b>?", "less direct": "Which flashlight's light is <b>less direct</b>?",
    "more energy": "Which flashlight puts <b>more energy</b> on each square?", "less energy": "Which flashlight puts <b>less energy</b> on each square?" }[kind];
  const hi = angles[more - 1], lo = angles[less - 1];
  const reason = `Flashlight ${more} shines at ${hi}°, closer to straight down (90°). Its light lands on fewer squares, so each square gets more energy: it's more direct. Flashlight ${less}'s light (${lo}°) is spread over more squares.`;
  const qs = [{ text, choices: [["Flashlight 1"], ["Flashlight 2"]], answer: ans - 1,
    hint: "Count the squares each patch of light covers. The same light on fewer squares means more energy on each one.", reason }];
  // Answer with descriptive times, one or two of them, so students see the morning and afternoon match (Adam, 2026-11-25).
  // Equinox heights in NYC: 7 AM 11°, 9 AM 32°, noon 49°. Late morning (11 AM, 47°) is left out: too close to noon for a 50° flashlight.
  const nycAns = { 15: [1, 5], 30: [2, 4], 50: [3], 90: [7] };
  const nycWhy = (a, n) => a === 90 ? "90° is straight down. The Sun is never straight overhead in NYC." :
    a === 50 ? `Flashlight ${n}'s light is at 50°. That's about as high as the Sun ever gets in NYC on the equinox: about 49°, at <b>noon</b>. That happens only once a day, at the top of the Sun's path.` :
    a === 15 ? `Flashlight ${n}'s light comes in low, at 15°. In NYC the Sun is that low <b>early in the morning</b> (about 7 AM), and again <b>late in the afternoon</b> (about 5 PM). Morning and afternoon mirror each other: the Sun climbs until noon, then comes back down the same way.` :
    `Flashlight ${n}'s light is at 30°. In NYC the Sun is that high <b>in the middle of the morning</b> (about 9 AM), and again <b>in the middle of the afternoon</b> (about 3 PM). Morning and afternoon mirror each other: the Sun climbs until noon, then comes back down the same way.`;
  for (const i of shuffle([0, 1]).slice(0, rng() < 0.5 ? 1 : 2))
    qs.push({ text: `In NYC, when is sunlight most like flashlight ${i + 1}'s light? <b>Pick one or two times.</b>`, choices: NYC_TIMES, times: true,
      multi: nycAns[angles[i]], answer: nycAns[angles[i]][0], nycAngle: angles[i], flash: i + 1,
      hint: "The Sun climbs all morning, is highest at noon, then comes back down the same way in the afternoon. Tap New York City's sky (bottom left) to see how high the Sun is at different times.",
      hint2: "One of those is right. The Sun is just as high at one more time of day. Find it.", reason: nycWhy(angles[i], i + 1) });
  const prob = { questions: qs, angles, flashFocus: null };
  prob.draw = svg => drawFlash(svg, angles, prob.flashFocus);
  return prob;
}

// Morning on the top row, afternoon on the bottom row, matching times stacked; noon spans both rows.
const NYC_TIMES = [["Sunrise", "6 AM"], ["Early morning", "7 AM"], ["Mid-morning", "9 AM"], ["Noon", "12 PM"],
  ["Mid-afternoon", "3 PM"], ["Late afternoon", "5 PM"], ["Sunset", "6 PM"], ["Impossible in NYC"]];
const TIME_POS = [[1, 1], [1, 2], [1, 3], ["1 / span 2", 4], [2, 3], [2, 2], [2, 1], [3, "1 / -1"]];

// ---------- tab 5: same latitude ----------
function genSameLat() {
  for (let t = 0; t < 600; t++) {
    const sc = mkScene(sunCam(pick(["above", "above", "high"])), true);
    const L = rnd(30, 52);
    const cats = shuffle([pick(["sunrise", "sunset"]), "morning", "noon", "afternoon", "night"]);
    const cs = cats.map(cat => ({ cat, lat: L, al: catAl(cat), compass: false }));
    const m = cs.find(c => c.cat === "morning"), a = cs.find(c => c.cat === "afternoon");
    if (Math.abs(Math.abs(m.al) - Math.abs(a.al)) < 12) continue;
    const gs = cs.map(c => cityG(sc, c));
    if (!gs.every(g => g.z > 0.15 && inView(g.x, g.y, 60)) || !spacedOK(gs, 80) || !clearOK(sc, gs, 66)) continue;
    const letters = shuffle(["A", "B", "C", "D", "E"]); cs.forEach((c, i) => c.letter = letters[i]);
    // Buttons follow the cities around the latitude line, the way Earth spins, from the city nearest the top (Adam, 2026-11-24)
    const top = cs[gs.reduce((bi, g, i) => g.y < gs[bi].y ? i : bi, 0)];
    const order = cs.slice().sort((x, y) => mod(x.al - top.al, 360) - mod(y.al - top.al, 360)).map(c => c.letter);
    const qL = (t, l, an, h, r) => qLetter(t, l, an, h, r, order);
    const by = cat => cs.find(c => c.cat === cat);
    const lit = cs.filter(c => ["morning", "noon", "afternoon"].includes(c.cat));
    const qs = [];
    // 1: time of day
    if (rng() < 0.5) { const cat = pick(["morning", "afternoon", "noon", cats.includes("sunrise") ? "sunrise" : "sunset", "night"]);
      qs.push(Object.assign(qL(`Which city is <b>${CAT_PHRASE[cat]}</b>?`, letters, by(cat).letter, TIME_HINT, timeReason(cat, by(cat).letter)), { focus: by(cat) })); }
    else { const c = pick(cs); qs.push({ text: `What time of day is it in ${bold(c.letter)}?`, choices: SCALE, scale: true, answer: CATS.indexOf(c.cat), hint: TIME_HINT, reason: timeReason(c.cat, c.letter), focus: c }); }
    // 2: where the Sun is
    const dirCands = cs.filter((c, i) => c.cat === "night" || (sunDir8(c) && compassOK(gs[i]) && sunArmOK(sc, gs[i], sunDir8(c), c)));
    if (rng() < 0.6 && dirCands.length) {
      const c = pick(dirCands); c.compass = true;
      qs.push(sunQ(c, true));
    } else {
      const sr = by("sunrise"), ss = by("sunset");
      const opts = [];
      if (sr) opts.push(["Which city sees the Sun in the <b>east</b>?", sr.letter, `The Sun is due east at sunrise, and city ${sr.letter} is at sunrise. Later in the morning the Sun has moved toward the south (southeast).`]);
      if (ss) opts.push(["Which city sees the Sun in the <b>west</b>?", ss.letter, `The Sun is due west at sunset, and city ${ss.letter} is at sunset. Earlier in the afternoon the Sun is more toward the south (southwest).`]);
      opts.push(["Which city <b>can't see the Sun</b> right now?", by("night").letter, `City ${by("night").letter} is on the night side.`]);
      const o = pick(opts); qs.push(qL(o[0], letters, o[1], "First work out the time of day in each city.", o[2]));
    }
    // 3: how direct
    const noon = by("noon"), far = lit.slice().sort((x, y) => Math.abs(y.al) - Math.abs(x.al))[0];
    const k = pick(["mostDirect", "mostEnergy", "least"]);
    if (k === "mostDirect") qs.push(qL("Which city has the <b>most direct</b> sunlight?", letters, noon.letter,
      "Which city is facing the Sun most straight on?", `City ${noon.letter} is around noon, in the middle of the day side, so the sunlight hits it most straight on. The same latitude line, but a different time of day.`));
    else if (k === "mostEnergy") qs.push(qL("Which city is absorbing the <b>most energy</b>?", letters, noon.letter,
      "More direct light puts more energy on each square. Which city gets the most direct light?", `City ${noon.letter} is around noon, so its light is the most direct and lands on the fewest squares. That's the most energy on each square.`));
    else { const ls = lit.map(c => c.letter).sort();
      qs.push(qL(`Of cities ${ls.join(", ").replace(/, ([^,]*)$/, " and $1")}, which is absorbing the <b>least energy</b>?`, ls, far.letter,
        "The farther a city is from noon, the lower the Sun and the more the light spreads out.",
        `City ${far.letter} is the farthest of the three from noon (it's ${CAT_PHRASE[far.cat]}, closer to ${far.cat === "morning" ? "sunrise" : "sunset"}). Its light comes in at the lowest angle and spreads over the most squares.`)); }
    cs.forEach(c => { c.beam = c.cat !== "night"; });   // sunrise and sunset cities get a beam that just skims in
    if (!marksOK(sc, cs, gs)) continue;
    const pic = { cities: cs, spin: true, latLine: L };
    return { view: { sc, pic }, questions: qs.filter(Boolean) };
  }
  return null;
}

// ---------- tab 6: same longitude ----------
function genSameLon() {
  const templates = [[0, 20, 40, 60], [5, 25, 45, 60], [0, 18, 38, 58], [10, 30, 50, 60]];
  const variant = rng() < 0.5;   // Adam, 2026-11-24: sometimes a time other than noon
  for (let t = 0; t < 3000; t++) {
    const side = rng() < 0.5 ? 1 : -1;
    const sc = mkScene(makeCam(side * rnd(50, 88), rnd(20, 48)), true, { R: 235 });
    const al = variant ? (rng() < 0.5 ? -1 : 1) * rnd(22, 60) : rnd(-6, 6);   // 8-10:30 AM or 1:30-4 PM
    const cs = pick(templates).map(lat => ({ lat: lat + rnd(-1, 1), al, compass: false, beam: true }));
    const gs = cs.map(c => cityG(sc, c));
    if (!gs.every(g => g.z > 0.15 && inView(g.x, g.y, 50)) || !spacedOK(gs, 62) || !clearOK(sc, gs, -18)) continue;
    const perp = [-sc.s2[1], sc.s2[0]], offs = gs.map(g => g.x * perp[0] + g.y * perp[1]).sort((x, y) => x - y);
    if (offs.some((o, i) => i && o - offs[i - 1] < 24)) continue;
    // No compasses here (none on stations 13-14): the Sun's direction comes from the time of day.
    const cat = variant ? (al > 0 ? "afternoon" : "morning") : "noon";
    cs.forEach(c => c.cat = cat);
    const dirCands = cs.filter(c => c.lat >= 15 && sunDir8(c) && (cat === "noon" ? sunDir8(c) === "S" : sunDir8(c).length === 2));
    const dc = dirCands.length ? pick(dirCands) : null;
    if (!marksOK(sc, cs, gs)) continue;
    const letters = shuffle(["A", "B", "C", "D"]); cs.forEach((c, i) => c.letter = letters[i]);
    // Grid boxes and answer buttons run top to bottom in the same order as the cities on the screen (Adam, 2026-11-24)
    const order = cs.map((c, i) => [c.letter, gs[i].y]).sort((x, y) => x[1] - y[1]).map(x => x[0]);
    const low = cs.slice().sort((x, y) => x.lat - y.lat)[0], high = cs.slice().sort((x, y) => y.lat - x.lat)[0];
    const tc = pick(cs), qs = [];
    qs.push({ text: `What time of day is it in ${bold(tc.letter)}?`, choices: SCALE, scale: true, answer: CATS.indexOf(cat), hint: TIME_HINT,
      reason: `All four cities are on the same longitude line, a line from pole to pole. Cities on the same longitude line have the same time of day. ` +
        (cat === "noon" ? "This line is in the middle of the day side, so it's around noon in every one of them."
          : cat === "morning" ? "This line hasn't reached the middle of the day side yet (follow the spin arrow), so it's morning in every one of them."
          : "This line has already passed the middle of the day side (follow the spin arrow), so it's afternoon in every one of them.") , focus: tc });
    const dirQ = c => sunQ(c, false, cat === "noon" ? " (Not for a city right on the equator: at noon there, the Sun is straight overhead.)" : "");
    const latQ = {
      mostDirect: () => qLetter("Which city has the <b>most direct</b> sunlight?", letters, low.letter, "Look at the grid at each city. Where does the light land on the fewest squares?",
        `City ${low.letter} is closest to the equator. At the same time of day, the light hits it most straight on, so it lands on the fewest squares.`, order),
      leastDirect: () => qLetter("Which city has the <b>least direct</b> sunlight?", letters, high.letter, "Look at the grid at each city. Where is the light spread over the most squares?",
        `City ${high.letter} is closest to the North Pole. The light hits it at a low, slanted angle and spreads over the most squares.`, order),
      mostEnergy: () => qLetter("Which city is absorbing the <b>most energy</b>?", letters, low.letter, "More direct light puts more energy on each square. Which city gets the most direct light?",
        `City ${low.letter} is closest to the equator, so its light is the most direct. The light lands on the fewest squares, so each square gets the most energy.`, order),
      leastEnergy: () => qLetter("Which city is absorbing the <b>least energy</b>?", letters, high.letter, "Less direct light spreads out over more squares. Which city's light is the most spread out?",
        `City ${high.letter} is closest to the North Pole, so its light is the least direct. The light is spread over the most squares, so each square gets the least energy.`, order)
    };
    const ks = shuffle(Object.keys(latQ));
    if (dc) { qs.push(dirQ(dc)); qs.push(latQ[ks[0]]()); }
    else { qs.push(latQ[ks[0]]()); qs.push(latQ[ks[1]]()); }
    const pic = { cities: cs, spin: true, spinLat: -18, lonLine: al, insets: true, order };
    return { view: { sc, pic }, questions: qs };
  }
  return null;
}

// ---------- tabs ----------
const TABS = [
  { label: "Directions", st: "Stations 1–3", gen: genDirections,
    intro: "Every city has a compass drawn on it. Use the city's compass, not the top of the screen. North always points toward the North Pole." },
  { label: "One city", st: "Stations 4–6", gen: genOneCity,
    intro: "The Sun shines from one side. The dark side is night. The arrow shows which way Earth spins." },
  { label: "Who's next?", st: "Stations 7–8", gen: genNext,
    intro: "The arrow shows which way Earth spins. Which city gets there first?" },
  { label: "Two flashlights", st: "Stations 9–10", gen: genFlash,
    intro: "Two flashlights shine on the same grid paper. The colored shapes are where the light lands." },
  { label: "Same latitude", st: "Stations 11–12", gen: genSameLat,
    intro: "All five cities are on the same latitude line (the dark line). Each city the Sun reaches gets its own beam of sunlight." },
  { label: "Same longitude", st: "Stations 13–14", gen: genSameLon,

];

function finalize(p) { if (p && p.view) { p.view.cur = p.view.sc; p.draw = svg => drawGlobe(svg, spunScene(p.view.cur), spunPic(p.view.pic)); } return p; }
// The tutorial's "watch a day go by" turns Earth under the Sun: SPIN_H hours later, every city (and the grid lines and
// continents) has moved 15 degrees an hour; the camera and the Sun stay put. 0 = the picture as generated.
let SPIN_H = 0;
const spunScene = sc => SPIN_H ? Object.assign({}, sc, { lon0: sc.lon0 + 15 * SPIN_H }) : sc;
function spunPic(pic) {
  if (!SPIN_H) return pic;
  const d = 15 * SPIN_H, cs = pic.cities.map(c => { const n = Object.assign({}, c, { al: c.al + d });
    if (c.beam !== undefined) n.beam = sinAlt(n) > -0.001; return n; });
  return Object.assign({}, pic, { cities: cs, focus: pic.focus ? cs[pic.cities.indexOf(pic.focus)] : null,
    lonLine: pic.lonLine === undefined ? undefined : pic.lonLine + d, landShift: (pic.landShift || 0) + d });
}
function generate(tab, seed) {
  for (let s = seed; s < seed + 50; s++) { rng = mulberry32(s * 7919 + tab * 1000003); const p = finalize(TABS[tab].gen()); if (p) { p.seed = s; if (p.view) p.view.pic.landShift = mod(s * 137.508, 360); return p; } }
  return null;
}

// ---------- self-test: ?selftest=1 ----------
const params = new URLSearchParams(location.search);
if (params.get("selftest")) {
  let out = "";
  TABS.forEach((T, tab) => {
    let fail = 0, bad = 0; const ans = {};
    for (let s = 1; s <= 400; s++) {
      rng = mulberry32(s * 7919 + tab * 1000003); const p = finalize(T.gen());
      if (!p) { fail++; continue; }
      for (const q of p.questions) { if (!(q.answer >= 0 && q.answer < q.choices.length)) bad++; const k = q.text.replace(/<[^>]+>/g, "").replace(/city [A-E]/g, "city _").slice(0, 46) + " → " + q.choices[q.answer][0]; ans[k] = (ans[k] || 0) + 1; }
      const svg = document.createElementNS(SVGNS, "svg"); p.draw(svg);
      if (/NaN|Infinity/.test(svg.innerHTML.replace(/data:[^"]*/g, ""))) bad++;
    }
    out += `\n== ${tab + 1} ${T.label}: no picture ${fail}/400 · broken ${bad}\n` + Object.entries(ans).sort().map(([k, v]) => `   ${v}\t${k}`).join("\n");
  });
  document.body.innerHTML = "<pre id='st'></pre>"; document.getElementById("st").textContent = out; document.title = "selftest done";
  return;
}

function tourDone(msg) {
  tour.ok = true; $("tourNext").disabled = false;

  $("tourNext").focus();
}
function tourPaint(svg) {   // runs after every redraw: dim all but the spotlight; check drag steps
  const S = tour.steps[tour.i], x = tourCtx();
  if (S.check && !tour.ok && tour.moved && S.check(x)) tourDone(S.okMsg && S.okMsg(x));
  if (S.anim) spinPaint(svg, S);
  const sp = S.spot && S.spot(x);

  const id = "tourHole", m = el("mask", { id }, el("defs", {}, svg));
  el("rect", { x: 0, y: 0, width: W, height: H, fill: "#fff" }, m);
  const shape = (parent, a) => sp.w ? el("rect", Object.assign({ x: sp.x, y: sp.y, width: sp.w, height: sp.h, rx: 14 }, a), parent)
    : el("circle", Object.assign({ cx: sp.x, cy: sp.y, r: sp.r }, a), parent);   // a circle, or a rectangle when w/h are given
  shape(m, { fill: "#000" });
  el("rect", { x: 0, y: 0, width: W, height: H, fill: "#fff", "fill-opacity": 0.6, mask: `url(#${id})`, "pointer-events": "none" }, svg);
  shape(svg, { fill: "none", stroke: "#1F8A9E", "stroke-width": 4, "stroke-dasharray": "10 6", "pointer-events": "none" });

// Taps on the picture (a press that doesn't move); presses that move are drags and turn the globe.
{ let down = null;
  $("svg").addEventListener("pointerdown", ev => { down = [ev.clientX, ev.clientY]; });
  $("svg").addEventListener("pointermove", ev => { if (tour && down && Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 8) tour.moved = true; });
  $("svg").addEventListener("pointerup", ev => {
    if (!tour || !down) return;
    const moved = Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 8; down = null;
    const S = tour.steps[tour.i]; if (moved || !S.tap || tour.ok) return;
    const pt = $("svg").createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const q = pt.matrixTransform($("svg").getScreenCTM().inverse()), r = S.tap(tourCtx(), [q.x, q.y]);
    if (r === true) tourDone(S.okMsg && S.okMsg(tourCtx())); else { $("tourMsg").className = "no"; $("tourMsg").innerHTML = r; }
  });
}
$("tourBtn").onclick = startTour;
$("tourSkip").onclick = () => endTour(false);
$("tourBack").onclick = () => { if (tour.i > 0) { tour.i--; tourStep(); } };

// ---------- read aloud ----------
// Speaker buttons use the browser's own text-to-speech (built into Chrome and Chromebooks; nothing to load).
// They read the intro, the question with its choices, the hint or explanation, and each tutorial step (Adam, 2026-11-24).
// The pictures are not read. Tap again to stop.
const SPEAKER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>' +
  '<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function spoken(t) {   // say symbols and short forms the way a person would read them out
  return t.replace(/[✓→←]/g, " ").replace(/° sign/g, "degree sign").replace(/°/g, " degrees")
    .replace(/(\d|AM|PM)\s*[–-]\s*(\d)/g, "$1 to $2")
    .replace(/\bNYC\b/g, "New York City").replace(/\b(NE|NW|SE|SW)\b/g, m => DIR_WORD[m])
    .replace(/\b(answer is) ([NESW])\./g, (m, a, d) => `${a} ${DIR_WORD[d]}.`)

}
// join pieces into sentences without doubling the punctuation ("Sun?." or "direction..")
const sentences = parts => parts.filter(Boolean).map(p => p.trim()).reduce((a, p) => !a ? p : a + (/[.?!:]$/.test(a) ? " " : ". ") + p, "");

function speak(btn, text) {

  stopSpeech();
  if (!text) return;
  const u = new SpeechSynthesisUtterance(spoken(text));
  u.lang = "en-US"; u.rate = 0.9;
  const vs = speechSynthesis.getVoices().filter(v => /^en(-|_)US/i.test(v.lang));
  const v = vs.find(v => /Google/.test(v.name)) || vs[0]; if (v) u.voice = v;
  u.onend = u.onerror = () => { if (sayingBtn === btn) { btn.classList.remove("on"); sayingBtn = null; } };
  sayingBtn = btn; btn.classList.add("on");

const textOf = id => $(id).innerText.trim();
function questionWords() {   // the question, then the answer choices that are showing
  const q = st.prob.questions[st.qi], box = $("choices").children;
  const ch = q.choices.filter((c, i) => box[i] && box[i].style.display !== "none")
    .map(c => (q.grid && DIR_WORD[c[0]] ? DIR_WORD[c[0]] : c[0]) + (c[1] ? ", " + c[1] : ""));
  return sentences([textOf("qtext"), ch.length ? (ch.length > 1 ? "The choices are: " : "The answer: ") + ch.join(". ") + "." : ""]);
}
const SAY = { sayIntro: () => textOf("intro"), sayQ: questionWords, sayFb: () => textOf("feedback"),
  sayTour: () => sentences([textOf("tourTitle"), textOf("tourText"), textOf("tourAsk"), textOf("tourMsg")]) };
if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) document.body.classList.add("nospeech");
else {
  speechSynthesis.getVoices();   // starts loading the voice list
  for (const id in SAY) { const b = $(id); b.innerHTML = SPEAKER; b.title = "Read aloud"; b.setAttribute("aria-label", "Read aloud"); b.onclick = () => speak(b, SAY[id]()); }
  // the hint/explanation speaker only shows when there is something to read
  new MutationObserver(() => { $("sayFb").hidden = !$("feedback").textContent.trim(); }).observe($("feedback"), { childList: true, characterData: true, subtree: true });
}
function score() { $("score").textContent = st.total ? `Right on the first try: ${st.right} of ${st.total}` : ""; }

const t0 = parseInt(params.get("tab"), 10);
if (t0 >= 1 && t0 <= TABS.length) st.tab = t0 - 1;
newPicture(parseInt(params.get("seed"), 10) || undefined);
