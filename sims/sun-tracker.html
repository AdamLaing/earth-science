<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun Tracker Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --font: Lexend, "Segoe UI", Helvetica, Arial, sans-serif; }
  html, body { margin: 0; height: 100%; background: #fff; font-family: var(--font); color: #222; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 28px 4px; gap: 20px; flex-wrap: wrap; }
  h1 { font-size: clamp(22px, 2.6vw, 40px); margin: 0; font-weight: 700; }
  .readout { display: flex; gap: 12px; flex-wrap: wrap; }
  .readout div { border: 3px solid #1F8A9E; border-radius: 12px; padding: 4px 14px; display: flex; align-items: baseline; gap: 10px; }
  .readout .q { color: #1F8A9E; font-weight: 600; font-size: 17px; }
  .readout .a { font-weight: 700; font-size: 24px; min-width: 70px; }
  .readout .a.hidden { color: #bbb; }
  main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr; gap: 6px 14px; padding: 0 16px; }
  main.two { grid-template-columns: 1.35fr 1fr; }
  .pane { min-width: 0; min-height: 0; display: flex; }
  .pane[hidden] { display: none; }
  .pane svg { width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--font); }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 14px 8px; border-top: 1px solid #ddd; }
  .bar button, .bar input[type=date] { font-family: var(--font); font-size: 16px; padding: 6px 12px; border-radius: 8px;
                border: 2px solid #444; background: #fff; cursor: pointer; color: #222; }
  .bar button:hover { background: #f2f2f2; }
  .bar button.on { background: #444; color: #fff; }
  .bar button.play { min-width: 100px; font-weight: 700; border-color: #E0A800; color: #9a7400; }
  .bar button.play.on { background: #E0A800; color: #fff; }
  .bar button.per { border-color: #1F8A9E; color: #1F8A9E; padding: 6px 9px; }
  .bar button.per.on { background: #1F8A9E; color: #fff; }
  .bar button.dir { border-color: #C46A12; color: #C46A12; font-weight: 700; }
  .bar button.dir.on { background: #F28C28; border-color: #F28C28; color: #fff; }
  .bar input[type=range] { width: min(240px, 20vw); accent-color: #E0A800; height: 26px; }
  .bar .clock { font-weight: 700; font-size: 18px; min-width: 88px; }
  .bar .eq { font-weight: 700; color: #9a7400; border: 2px solid #E0A800; border-radius: 8px; padding: 5px 10px; }
  .bar .sep { width: 1px; height: 28px; background: #ccc; margin: 0 4px; }
</style>
</head>
<body>

<header>
  <h1>Sun Tracker</h1>
  <div class="readout">
    <div><span class="q">Time</span><span class="a" id="rTime">—</span></div>
    <div><span class="q">Direction</span><span class="a" id="rDir">—</span></div>
    <div><span class="q">How high?</span><span class="a" id="rHigh">—</span></div>
  </div>
</header>

<main id="main">
  <div class="pane" id="paneDome"><svg id="dome" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="pane" id="paneDirect" hidden><svg id="direct" viewBox="0 0 700 720" preserveAspectRatio="xMidYMid meet"></svg></div>
</main>

<div class="bar">
  <span class="eq">Equinox Sun</span>
  <button id="play" class="play">▶ Play</button>
  <input id="slider" type="range" min="360" max="1080" step="1" aria-label="Time of day">
  <span class="clock" id="clock">—</span>
  <span class="sep"></span>
  <span id="periods"></span>
  <span class="sep"></span>
  <button id="ansBtn" class="on">answers</button>
  <button id="fistBtn" class="on">fists</button>
  <button id="pathBtn">Sun's path</button>
  <button id="dirBtn" class="dir">② How direct?</button>
  <button id="pinBtn">📌 Pin this time</button>
  <button id="fsBtn" title="full screen (F)">⛶</button>
</div>

<script>
(function () {
  const NS = "http://www.w3.org/2000/svg", rad = Math.PI / 180;
  const $ = (id) => document.getElementById(id);
  const f = (v) => v.toFixed(1);
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function txt(parent, x, y, s, attrs) { const t = el("text", Object.assign({x, y}, attrs || {}), parent); t.textContent = s; return t; }

  // ---------- the real Sun, for NYC ----------
  const LAT = 40.74, LON = -73.98;
  // Equinox Sun (Adam, 2026-11-23): rises due east at 6:00, highest (49°) due south at noon, sets due west at 6:00,
  // the same model as One Day in NYC. Real November angles are lower, and sunrise/sunset north or south of
  // due east/west hasn't been taught yet.
  function sunPos(min) {                        // degrees: alt above the horizon, az clockwise from north
    const H = (min / 60 - 12) * 15 * rad, phi = LAT * rad;
    const alt = Math.asin(Math.cos(phi) * Math.cos(H));
    const az = Math.atan2(-Math.sin(H), -Math.sin(phi) * Math.cos(H));
    return { alt: alt / rad, az: (az / rad + 720) % 360 };
  }
  function dirLabel(az) { return ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(az / 45) % 8]; }
  function fistText(alt) {
    const k = Math.round(alt / 5) / 2, whole = Math.floor(k), half = k - whole > 0.01;
    if (k === 0) return "on the horizon";
    const s = (whole ? whole : "") + (half ? "½" : "");
    return "about " + (s || "0") + (k === 1 ? " fist" : " fists");
  }
  function halves(x) { const k = Math.round(x * 2) / 2, w = Math.floor(k); return (w ? w : "") + (k - w > 0.01 ? "½" : "") || "0"; }
  function clockText(min) {
    const h = Math.floor(min / 60), m = Math.floor(min % 60);
    return ((h + 11) % 12 + 1) + ":" + String(m).padStart(2, "0") + (h < 12 ? " AM" : " PM");
  }

  // ---------- state ----------
  const params = new URLSearchParams(location.search);
  // Jump buttons (Adam, 2026-11-23): 7 roughly equal steps from sunrise to sunset. The ends sit 5 minutes inside the day,
  // because at exactly 6:00 the Sun is on the horizon (0°) and its light would spread over endless squares.
  const PERIODS = [["Sunrise", 365], ["", 480], ["", 600], ["", 720], ["", 840], ["", 960], ["Sunset", 1075]];   // 6:05 8 10 12 2 4 5:55
  const parseHM = (s) => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ""); return m ? +m[1] * 60 + +m[2] : null; };
  const now = new Date();
    let nowMin = now.getHours() * 60 + now.getMinutes(); if (nowMin < 360 || nowMin > 1080) nowMin = 480;
  const st = {
    min: parseHM(params.get("time")) ?? nowMin,
    answers: params.get("answers") !== "off",
    fists: params.get("fists") !== "off",
    path: params.get("path") === "on",
    direct: params.get("direct") === "on",
    pin: parseHM(params.get("pin")),
    playing: false
  };

  // ---------- the dome (U3 p. 4) ----------
  const dome = $("dome");
  const CX = 500, CY = 520, R = 400, EL = 20 * rad, cE = Math.cos(EL), sE = Math.sin(EL);
  function warp(th) {                           // SE/SW nearer halfway across, as on the p. 4 slide
    const a = Math.abs(th), s = Math.sign(th);
    return s * (a <= 45 ? a * 32 / 45 : a <= 90 ? 32 + (a - 45) * 58 / 45 : a);
  }
  function P(th, h) {                           // th: degrees from south, + toward west; h: degrees above the horizon
    const ph = warp(th) * rad, hr = h * rad;
    const X = Math.cos(hr) * Math.sin(ph), Z = Math.cos(hr) * Math.cos(ph), Y = Math.sin(hr);
    return [CX + R * X, CY - R * (Y * cE + Z * sE)];
  }
  const line = (pts) => pts.map((p, i) => (i ? "L" : "M") + f(p[0]) + "," + f(p[1])).join("");
  const range = (a, b, step) => { const r = []; for (let v = a; step > 0 ? v <= b + 1e-9 : v >= b - 1e-9; v += step) r.push(v); return r; };
  const thOf = (az) => { let t = az - 180; if (t > 180) t -= 360; if (t < -180) t += 360; return t; };

  function sunSymbol(parent, x, y, r, opacity) {
    const g = el("g", {transform: `translate(${f(x)},${f(y)})`, opacity: opacity == null ? 1 : opacity}, parent);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a), px = -s, py = c, b1 = r + 4, b2 = r + 14, w = 5;
      el("polygon", {fill: "#FFC20E", points:
        `${f(b1*c + w*px)},${f(b1*s + w*py)} ${f(b1*c - w*px)},${f(b1*s - w*py)} ${f(b2*c)},${f(b2*s)}`}, g);
    }
    el("circle", {r, fill: "#FFC20E", stroke: "#E0A800", "stroke-width": 2}, g);
    return g;
  }
  function bubble(parent, cx, cy, lines) {      // Brain Frames thought bubble (view tag)
    const g = el("g", {}, parent);
    const p = [[-95,0,30],[-55,-24,34],[0,-30,36],[55,-22,32],[92,2,27],[52,25,30],[-5,30,32],[-62,26,28],[-102,12,20]];
    p.forEach(([x,y,r]) => el("circle", {cx: cx+x, cy: cy+y, r, fill: "#fff", stroke: "#444", "stroke-width": 2.5}, g));
    p.forEach(([x,y,r]) => el("circle", {cx: cx+x, cy: cy+y, r: r-2.5, fill: "#fff"}, g));
    el("ellipse", {cx, cy, rx: 92, ry: 34, fill: "#fff"}, g);
    el("circle", {cx: cx-62, cy: cy+60, r: 8, fill: "#fff", stroke: "#444", "stroke-width": 2.5}, g);
    el("circle", {cx: cx-72, cy: cy+75, r: 4.5, fill: "#fff", stroke: "#444", "stroke-width": 2.5}, g);
    lines.forEach((s, i) => txt(g, cx, cy + 6 + (i - (lines.length - 1) / 2) * 22, s, {"font-size": 17, "text-anchor": "middle", fill: "#222", id: "bub" + i}));
  }
  function arrowMarker(svg, id, color) {
    const defs = el("defs", {}, svg);
    const m = el("marker", {id, viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 4, markerHeight: 4, orient: "auto-start-reverse"}, defs);
    el("path", {d: "M0,0 L10,5 L0,10 Z", fill: color}, m);
  }

  let skyBack, skyBand, dyn;
  (function buildDome() {
    arrowMarker(dome, "arrD", "#F28C28");
    arrowMarker(dome, "arrK", "#333");
    const far = range(90, -90, -3).map((t) => P(t, 0));
    skyBack = el("path", {d: `M${CX - R},${CY} A${R},${R} 0 0 1 ${CX + R},${CY} ` + line(far).replace(/^M/, "L") + "Z", fill: "#EAF3FB"}, dome);
    const merid = range(0, 90, 3).map((h) => P(90, h)).concat(range(90, 0, -3).map((h) => P(-90, h)));
    skyBand = el("path", {d: `M${CX - R},${CY} A${R},${R} 0 0 1 ${CX + R},${CY} ` + line(merid).replace(/^M/, "L") + "Z", fill: "#D3E3F3"}, dome);
    el("path", {d: line(merid), fill: "none", stroke: "#2C7BC4", "stroke-width": 2, "stroke-dasharray": "6 6"}, dome);
    [10, 20, 30, 40, 50].forEach((h) => {
      el("path", {d: line(range(-90, 90, 3).map((t) => P(t, h))), fill: "none", stroke: "#8FB3D6", "stroke-width": 1.6}, dome);
      const y = P(90, h)[1], dx = Math.sqrt(R * R - (CY - y) * (CY - y));
      [-1, 1].forEach((s) => {
        const x = CX + s * (dx + 48);
        el("rect", {x: x - 30, y: y - 15, width: 60, height: 30, rx: 7, fill: "#fff", stroke: "#8FB3D6", "stroke-width": 1.5}, dome);
        txt(dome, x, y + 6, h + "°", {"font-size": 16, "text-anchor": "middle", fill: "#333"});
      });
    });
    [-45, 0, 45].forEach((t) => el("path", {d: line(range(0, 90, 2).map((h) => P(t, h))), fill: "none", stroke: "#2C7BC4",
      "stroke-width": 2.5, "stroke-dasharray": "1 8", "stroke-linecap": "round"}, dome));
    el("path", {d: `M${CX - R},${CY} A${R},${R} 0 0 1 ${CX + R},${CY}`, fill: "none", stroke: "#2C7BC4", "stroke-width": 3}, dome);
    const z = P(0, 90);
    el("circle", {cx: z[0], cy: z[1], r: 6, fill: "#2C7BC4"}, dome);
    el("line", {x1: z[0], y1: 58, x2: z[0], y2: z[1] - 12, stroke: "#333", "stroke-width": 2.5, "marker-end": "url(#arrK)"}, dome);
    txt(dome, z[0], 48, "straight overhead (90°)", {"font-size": 17, "text-anchor": "middle", fill: "#1d5c93"});
    // ground
    el("ellipse", {cx: CX, cy: CY, rx: R, ry: R * sE, fill: "#E8DCC8", stroke: "#7A5230", "stroke-width": 3}, dome);
    [-90, -45, 0, 45, 90].forEach((t) => { const p = P(t, 0);
      el("line", {x1: CX, y1: CY, x2: p[0], y2: p[1], stroke: "#7A5230", "stroke-width": 2.5}, dome); });
    [["SE", -45], ["S", 0], ["SW", 45]].forEach(([s, t]) => { const p = P(t, 0);
      txt(dome, p[0] + (t ? -Math.sign(t) * 4 : -14), p[1] + 30, s, {"font-size": 22, "font-weight": 700, "text-anchor": "middle"}); });
    txt(dome, CX - R - 28, CY + 10, "E", {"font-size": 26, "font-weight": 700, "text-anchor": "middle"});
    txt(dome, CX + R + 28, CY + 10, "W", {"font-size": 26, "font-weight": 700, "text-anchor": "middle"});
    txt(dome, CX, 702, "You are facing south. North is behind you.", {"font-size": 19, "text-anchor": "middle", fill: "#5a3d1e", id: "domeCap"});
    bubble(dome, 880, 120, ["Standing in NYC,", "facing south", "(seen from behind)"]);
    dyn = el("g", {}, dome);
    // stick figure, on top of everything at the centre of the ground
    const fig = el("g", {stroke: "#111", "stroke-width": 3.5, fill: "none", "stroke-linecap": "round"}, dome);
    el("circle", {cx: CX, cy: CY - 64, r: 11, fill: "#fff"}, fig);
    el("path", {d: `M${CX},${CY - 53} L${CX},${CY - 22} M${CX - 15},${CY - 42} L${CX + 15},${CY - 42} M${CX},${CY - 22} L${CX - 12},${CY} M${CX},${CY - 22} L${CX + 12},${CY}`}, fig);
  })();

  function renderDome(pos, pinPos) {
    dyn.replaceChildren();
    const up = pos.alt > 0;
    const sky = up ? "#EAF3FB" : "#C9CED6", band = up ? "#D3E3F3" : "#B7BEC9";
    skyBack.setAttribute("fill", sky); skyBand.setAttribute("fill", band);
    if (st.path) {                              // today's whole path, sunrise to sunset
      let runs = [], cur = null;
      for (let m = 0; m <= 1440; m += 4) {
        const p = sunPos((m));
        if (p.alt > 0) { (cur || (cur = runs[runs.length] = [])).push(P(thOf(p.az), p.alt)); } else cur = null;
      }
      runs.forEach((r) => el("path", {d: line(r), fill: "none", stroke: "#E0A800", "stroke-width": 3, "stroke-dasharray": "9 8"}, dyn));
    }
    if (pinPos && pinPos.alt > 0) {
      const q = P(thOf(pinPos.az), pinPos.alt);
      sunSymbol(dyn, q[0], q[1], 14, 0.45);
      txt(dyn, q[0], q[1] - 30, "📌 " + clockText(st.pin), {"font-size": 16, "text-anchor": "middle", fill: "#7a6200"});
    }
    if (!up) {
      txt(dyn, CX, 330, "The Sun is down (below the horizon).", {"font-size": 28, "font-weight": 700, "text-anchor": "middle", fill: "#333"});
      return;
    }
    const th = thOf(pos.az), g0 = P(th, 0), s = P(th, pos.alt);
    el("line", {x1: CX, y1: CY, x2: g0[0], y2: g0[1], stroke: "#E0A800", "stroke-width": 4, "stroke-dasharray": "10 6"}, dyn);
    if (st.fists) {
      el("path", {d: line(range(0, pos.alt, 1).concat([pos.alt]).map((h) => P(th, h))), fill: "none", stroke: "#9a7400",
        "stroke-width": 3, "stroke-dasharray": "2 6", "stroke-linecap": "round"}, dyn);
      for (let k = 10; k < pos.alt - 5; k += 10) {
        const p = P(th, k), right = th < 0;
        el("circle", {cx: p[0], cy: p[1], r: 6, fill: "#fff", stroke: "#9a7400", "stroke-width": 2.5}, dyn);
        txt(dyn, p[0] + (right ? 14 : -14), p[1] + 6, String(k / 10), {"font-size": 17, "font-weight": 700, fill: "#9a7400",
          "text-anchor": right ? "start" : "end"});
      }
    }
    if (st.direct) {                            // three parallel arrows from the Sun to the person's feet (Adam, 2026-11-23)
      const tgt = [CX, CY], dx = tgt[0] - s[0], dy = tgt[1] - s[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      [-16, 0, 16].forEach((o) => el("line", {x1: f(s[0] + ux * 34 - uy * o), y1: f(s[1] + uy * 34 + ux * o),
        x2: f(tgt[0] - ux * 4 - uy * o), y2: f(tgt[1] - uy * 4 + ux * o), stroke: "#F28C28", "stroke-width": 4, "marker-end": "url(#arrD)"}, dyn));
    }
    sunSymbol(dyn, s[0], s[1], 18);
    if (st.fists && st.answers) {
      const right = th < 0;
      txt(dyn, s[0] + (right ? 40 : -40), s[1] - 26, fistText(pos.alt), {"font-size": 18, "font-weight": 700, fill: "#9a7400",
        "text-anchor": right ? "start" : "end"});
    }
  }

  // ---------- How direct? (three arrows on a row of squares) ----------
  const dsvg = $("direct");
  arrowMarker(dsvg, "arrS", "#F28C28");
  arrowMarker(dsvg, "arrS2", "#F28C28");
  const ORANGE = [242, 140, 40], WHITE = [255, 255, 255];
  const mix = (k) => { k = Math.max(0, Math.min(1, k)); return "rgb(" + WHITE.map((w, i) => Math.round(w + (ORANGE[i] - w) * k)).join(",") + ")"; };
  let clipN = 0;
  function strip(parent, y0, H, pos, label) {
    const N = 14, X0 = 42, W = 616, B = W / N, BH = 34, yg = y0 + H - 100;
    txt(parent, X0, y0 + 22, label, {"font-size": 20, "font-weight": 700, fill: "#333"});
    const boxes = [];
    for (let i = 0; i < N; i++) boxes.push(el("rect", {x: X0 + i * B, y: yg, width: B, height: BH, fill: "#fff", stroke: "#7A5230", "stroke-width": 2}, parent));
    if (pos.alt <= 0) {
      txt(parent, X0 + W / 2, (y0 + yg) / 2 + 10, "The Sun is down: no sunlight lands here.", {"font-size": 22, "text-anchor": "middle", fill: "#555"});
      return;
    }
    const h = pos.alt * rad, sh = Math.sin(h), ch = Math.cos(h), fromLeft = thOf(pos.az) < 0;   // morning Sun is east = left
    const mid = X0 + W / 2, F = 2 * B / sh, a = mid - F / 2, b = mid + F / 2;
    boxes.forEach((r, i) => { const x = X0 + i * B, c = Math.max(0, Math.min(x + B, b) - Math.max(x, a)) / B; r.setAttribute("fill", mix(c * sh)); });
    const id = "clip" + (++clipN);
    el("rect", {x: X0 - 6, y: y0 + 34, width: W + 12, height: yg - y0 - 34 + 1}, el("clipPath", {id}, el("defs", {}, parent)));
    const g = el("g", {"clip-path": `url(#${id})`}, parent);
    const dx = fromLeft ? ch : -ch, Lr = (yg - y0) / sh + 20;
    const start = (x) => [x - dx * Lr, yg - sh * Lr];
    const sa = start(a), sb = start(b);
    el("polygon", {points: `${f(sa[0])},${f(sa[1])} ${f(a)},${yg} ${f(b)},${yg} ${f(sb[0])},${f(sb[1])}`, fill: "rgba(255,194,14,0.22)"}, g);
    [a, mid, b].forEach((x) => { const s0 = start(x);
      el("line", {x1: f(s0[0]), y1: f(s0[1]), x2: f(x - dx * 3), y2: f(yg - sh * 3), stroke: "#F28C28", "stroke-width": 5, "marker-end": "url(#arrS)"}, g); });
    // the angle at the ground
    const rA = 46, sgn = fromLeft ? -1 : 1, ax = (fromLeft ? a : b);
    const p1 = [ax + sgn * rA, yg], p2 = [ax + sgn * rA * ch, yg - rA * sh];
    el("path", {d: `M${f(p1[0])},${f(p1[1])} A${rA},${rA} 0 0 ${fromLeft ? 1 : 0} ${f(p2[0])},${f(p2[1])}`, fill: "none", stroke: "#333", "stroke-width": 2.5}, g);
    const hb = h / 2, lx = ax + sgn * (rA + 30) * Math.cos(hb), ly = yg - (rA + 30) * Math.sin(hb) + 6;
    txt(g, f(lx), f(ly), st.answers ? Math.round(pos.alt) + "°" : "?", {"font-size": 18, "font-weight": 700, "text-anchor": "middle", fill: "#333"});
    const n = F / B;
    txt(parent, X0 + W / 2, yg + BH + 28, n > N ? "The same sunlight spreads over more than " + N + " squares."
      : "The same sunlight lands on about " + halves(n) + " squares.", {"font-size": 20, "text-anchor": "middle", fill: "#333"});
    if (n > 2.25) txt(parent, X0 + W / 2, yg + BH + 54, "Spread out, so each square gets less.", {"font-size": 18, "text-anchor": "middle", fill: "#C46A12", "font-weight": 600});
  }
  function renderDirect(pos, pinPos) {
    dsvg.querySelectorAll(":scope > g").forEach((n) => n.remove());
    const g = el("g", {}, dsvg);
    txt(g, 28, 46, "② How direct?", {"font-size": 30, "font-weight": 700, fill: "#C46A12"});
    // reference: straight overhead = 2 bright squares (kit energy patch)
    const RX = 470, RY = 112, RB = 34;
    for (let i = 0; i < 5; i++) el("rect", {x: RX + i * RB, y: RY, width: RB, height: 24, fill: i === 1 || i === 2 ? mix(1) : "#fff", stroke: "#7A5230", "stroke-width": 1.5}, g);
    [RX + RB, RX + 2 * RB, RX + 3 * RB].forEach((x) => el("line", {x1: x, y1: 66, x2: x, y2: RY - 3, stroke: "#F28C28", "stroke-width": 3.5, "marker-end": "url(#arrS2)"}, g));
    txt(g, 28, 96, "If the Sun were straight overhead", {"font-size": 17, fill: "#444"});
    txt(g, 28, 120, "(never in NYC): 2 bright squares.", {"font-size": 17, fill: "#444"});
    el("line", {x1: 20, y1: 152, x2: 680, y2: 152, stroke: "#ddd", "stroke-width": 2}, g);
    if (pinPos) {
      strip(g, 162, 270, pinPos, "📌 " + clockText(st.pin) + (pinPos.alt > 0 && st.answers ? " · " + Math.round(pinPos.alt) + "° high" : ""));
      strip(g, 440, 280, pos, "Now · " + clockText(st.min) + (pos.alt > 0 && st.answers ? " · " + Math.round(pos.alt) + "° high" : ""));
    } else {
      strip(g, 170, 520, pos, clockText(st.min) + (pos.alt > 0 && st.answers ? " · " + Math.round(pos.alt) + "° high" : ""));
    }
  }

  // ---------- render + controls ----------
  function render() {
    const pos = sunPos((st.min)), pinPos = st.pin == null ? null : sunPos((st.pin));
    $("rTime").textContent = clockText(st.min);
    $("clock").textContent = clockText(st.min);
    const up = pos.alt > 0;
    $("rDir").textContent = st.answers ? (up ? dirLabel(pos.az) : "down") : "?";
    $("rHigh").textContent = st.answers ? (up ? Math.round(pos.alt) + "°" : "—") : "?";
    $("rDir").classList.toggle("hidden", !st.answers); $("rHigh").classList.toggle("hidden", !st.answers);
    $("slider").value = st.min;
    document.querySelectorAll("button.per").forEach((b) => b.classList.toggle("on", Math.abs(+b.dataset.min - st.min) < 0.5));
    renderDome(pos, pinPos);
    if (st.direct) renderDirect(pos, pinPos);
  }
  function layout() {
    $("paneDirect").hidden = !st.direct;
    $("main").classList.toggle("two", st.direct);
    $("dirBtn").classList.toggle("on", st.direct);
    $("ansBtn").classList.toggle("on", st.answers);
    $("fistBtn").classList.toggle("on", st.fists);
    $("pathBtn").classList.toggle("on", st.path);
    $("pinBtn").classList.toggle("on", st.pin != null);
    $("pinBtn").textContent = st.pin == null ? "📌 Pin this time" : "📌 Unpin " + clockText(st.pin);
  }
  const per = $("periods");
  PERIODS.forEach(([name, m]) => {
    const b = document.createElement("button");
    b.className = "per"; b.dataset.min = m; b.textContent = name || clockText(m).replace(/ [AP]M$/, "");
    b.addEventListener("click", () => { setPlaying(false); st.min = m; render(); });
    per.appendChild(b); per.appendChild(document.createTextNode(" "));
  });
  $("slider").addEventListener("input", (e) => { setPlaying(false); st.min = +e.target.value; render(); });
  $("ansBtn").addEventListener("click", () => { st.answers = !st.answers; layout(); render(); });
  $("fistBtn").addEventListener("click", () => { st.fists = !st.fists; layout(); render(); });
  $("pathBtn").addEventListener("click", () => { st.path = !st.path; layout(); render(); });
  $("dirBtn").addEventListener("click", () => { st.direct = !st.direct; layout(); render(); });
  $("pinBtn").addEventListener("click", () => { st.pin = st.pin == null ? Math.round(st.min) : null; layout(); render(); });
  $("fsBtn").addEventListener("click", toggleFs);
  function toggleFs() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

  let last = null;
  function frame(ts) {
    if (!st.playing) return;
    if (last != null) { st.min += (ts - last) / 1000 * 20; if (st.min > 1080) st.min = 360; }   // 20 minutes of sky per second
    last = ts; render(); requestAnimationFrame(frame);
  }
  function setPlaying(p) {
    st.playing = p; last = null;
    $("play").classList.toggle("on", p); $("play").textContent = p ? "❚❚ Pause" : "▶ Play";
    if (p) requestAnimationFrame(frame); else { st.min = Math.round(st.min); }
  }
  $("play").addEventListener("click", () => setPlaying(!st.playing));
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === " ") { e.preventDefault(); setPlaying(!st.playing); }
    else if (e.key === "ArrowRight") { setPlaying(false); st.min = Math.min(1080, st.min + 5); render(); }
    else if (e.key === "ArrowLeft") { setPlaying(false); st.min = Math.max(360, st.min - 5); render(); }
    else if (e.key === "f" || e.key === "F") toggleFs();
  });

  layout(); render();
})();
</script>
</body>
</html>
